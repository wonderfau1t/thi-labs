[project]
name = "thi-labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=test-results.xml"

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
